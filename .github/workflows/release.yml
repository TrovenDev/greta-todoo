name: Publicar aplicativo Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Validar versão e novidades
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'A tag deve corresponder à versão no package.json.' }
          node scripts/release-notes.cjs
      - name: Gerar e publicar instalador e manifesto de atualização
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Adicionar notas à release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:GITHUB_REF_NAME --notes-file RELEASE_NOTES.md --draft=false
      - uses: actions/upload-artifact@v4
        with:
          name: Troven-Tarefas-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
