name: Publicar aplicativo Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Validar versão e novidades
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) { throw 'A tag deve corresponder à versão no package.json.' }
          node scripts/release-notes.cjs
      - name: Gerar instalador e manifesto de atualização
        run: npm run build
      - name: Publicar arquivos e notas em uma única release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          $installer = "dist/Troven-Tarefas-Setup-$($tag.Substring(1)).exe"
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer "$installer.blockmap" dist/latest.yml --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar os arquivos.' }
            gh release edit $tag --notes-file RELEASE_NOTES.md --draft=false --latest
          } else {
            gh release create $tag $installer "$installer.blockmap" dist/latest.yml --verify-tag --title "Troven Tarefas $tag" --notes-file RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Troven-Tarefas-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
